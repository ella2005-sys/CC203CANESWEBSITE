{% extends 'base.html' %}
{% block content %}
<style>
    .builder {
        max-width: 600px;
        margin: 2rem auto;
        background: #ffe6f2;
        padding: 2rem;
        border-radius: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        font-family: 'Poppins', sans-serif;
    }
    .builder h2 {
        text-align: center;
        color: #d63384;
        margin-bottom: 1rem;
    }
    form label {
        font-weight: 600;
        color: #333;
    }
    form select, form textarea {
        width: 100%;
        padding: 0.5rem;
        margin: 0.5rem 0 1rem 0;
        border-radius: 8px;
        border: 1px solid #ccc;
    }
    form input[type="checkbox"] {
        margin-right: 0.5rem;
    }
    button {
        display: block;
        width: 100%;
        padding: 0.7rem;
        background: #ff4da6;
        border: none;
        color: white;
        font-size: 1rem;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }
    button:hover {
        background: #e60073;
    }
</style>

<div class="builder">
    <h2>🌸 Build Your Own Bouquet</h2>
    <form method="POST">
        <label>Select Flowers:</label><br>
        {% for flower in flowers %}
            <input type="checkbox" name="flowers" value="{{ flower }}"> {{ flower }}<br>
        {% endfor %}

        <label for="color">Choose Color:</label>
        <select name="color" required>
            {% for c in colors %}
                <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>

        <label for="wrapper">Select Wrapper:</label>
        <select name="wrapper" required>
            {% for w in wrappers %}
                <option value="{{ w }}">{{ w }}</option>
            {% endfor %}
        </select>

        <label for="message">Add a Message:</label>
        <textarea name="message" rows="3" placeholder="Write your dedication..."></textarea>

        <button type="submit">Preview My Bouquet 🌷</button>
    </form>
</div>
{% endblock %}
