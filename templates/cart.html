{% extends 'base.html' %}
{% block content %}
<section class="info-page">
    <h1>Your Cart</h1>
    {% if cart and cart|length > 0 %}
        <table class="cart-table">
            <tr>
                <th>Flower</th>
                <th>Price</th>
            </tr>
            {% for item in cart %}
            <tr>
                <td>{{ item.name }}</td>
                <td>₱{{ item.price }}</td>
            </tr>
            {% endfor %}
        </table>
        <h3 class="cart-total">Total: ₱{{ total }}</h3>
    {% else %}
        <p>Your cart is empty 🌸</p>
    {% endif %}
</section>
{% endblock %}
