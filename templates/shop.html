{% extends 'base.html' %}
{% block content %}
<section class="shop">
    <h1>Our Beautiful Collections</h1>
    <p>Discover our handpicked floral arrangements, crafted with care and love.</p>

    <div class="shop-grid">
        {% for p in products %}
        <div class="shop-card">
            <img src="{{ p.img }}" alt="{{ p.name }}">
            <h3>{{ p.name }}</h3>
            <p class="price">₱{{ p.price }}</p>
            <a href="{{ url_for('add_to_cart', product_id=p.id) }}" class="add-btn">Add to Cart</a>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
