{% extends 'base.html' %}
{% block content %}

<style>
.hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 5rem 2rem 3rem;
    background-image: url("{{ url_for('static', filename='images/occasionbg.jpg') }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: #b34786;
}
.hero h1 { font-size: 3rem; font-weight: 700; margin-bottom: 1rem; }
.hero p { font-size: 1.2rem; color: #8c2d5f; max-width: 700px; line-height: 1.7; }

.shop-section { text-align: center; padding: 4rem 2rem; background-color: #fff0f6; }
.shop-section h3 { font-size: 2rem; color: #b34786; margin-bottom: 3rem; letter-spacing: 1px; text-transform: uppercase; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; max-width: 1200px; margin: 0 auto; }
.product-card { background: #fff; border-radius: 20px; padding: 1.5rem; box-shadow: 0 8px 20px rgba(183, 126, 220, 0.15); text-align: center; transition: transform 0.3s ease, box-shadow 0.3s ease; }
.product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(183, 126, 220, 0.3); }
.product-card img { width: 100%; max-width: 220px; height: 220px; object-fit: cover; border-radius: 15px; margin-bottom: 1rem; }
.product-card h3 { font-size: 1.3rem; color: #b34786; margin-bottom: 0.5rem; }
.product-card p { font-size: 1rem; color: #555; margin-bottom: 0.5rem; }
.price { font-size: 1.2rem; color: #b34786; font-weight: 600; margin-top: 0.5rem; }
.add-btn { background: #ff99c8; border: none; padding: 8px 14px; color: white; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s; }
.add-btn:hover { background: #e673b8; }
</style>

<section class="hero">
    <h1>{{ occasion_type }} Flowers</h1>
    <p>{{ message }}</p>
</section>

<section class="shop-section">
    <h3>🌸 Our Collection 🌸</h3>
    <div class="shop-grid">
        {% for product in occasion_products %}
        <div class="product-card">
            <img src="{{ url_for('static', filename='images/' + occasion_type.lower() + '/' + product.image) }}" alt="{{ product.name }}">
            <h3>{{ product.name }}</h3>
            <p>{{ product.description }}</p>
            <p class="price">₱{{ product.price }}</p>
            <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="POST">
                <button type="submit" class="add-btn">Add to Cart</button>
            </form>
        </div>
        {% endfor %}
    </div>
</section>

{% endblock %}
